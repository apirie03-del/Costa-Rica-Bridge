<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24D"/>
      <stop offset="100%" stop-color="#E0BE6E"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#C9A24D" stroke-width="4"/>
  <circle cx="120" cy="120" r="100" fill="#FFFFFF"/>

  <!-- rising sun arc behind mountains -->
  <path d="M 62 118 A 58 58 0 0 1 178 118" fill="none" stroke="url(#sunArc)" stroke-width="6" stroke-linecap="round"/>

  <!-- mountain range -->
  <path d="M 55 158
           L 92 100
           L 114 128
           L 132 96
           L 168 158
           Z"
        fill="none"
        stroke="#134B44"
        stroke-width="7"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- baseline -->
  <line x1="48" y1="158" x2="192" y2="158" stroke="#134B44" stroke-width="5" stroke-linecap="round"/>
</svg>
